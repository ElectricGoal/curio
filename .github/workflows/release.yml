# Builds the self-contained disk image and attaches it to a GitHub release
# whenever a version tag is pushed:
#
#   git tag v0.0.1 && git push origin v0.0.1
#
# Without the signing secrets below the image is ad-hoc signed, and macOS asks
# users to confirm before opening it (see "Download" in the README).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  disk-image:
    # Apple Silicon. MLX (the decision model's runtime) needs Swift 6.3, so Xcode 26.4 or later.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Make sure the Metal compiler is installed
        run: |
          swift --version
          xcrun -sdk macosx -f metal || xcodebuild -downloadComponent MetalToolchain

      - name: Run the tests
        run: |
          source scripts/env.sh
          swift test --package-path macos

      - name: Build the disk image
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
        run: APP_VERSION="${GITHUB_REF_NAME#v}" bash scripts/build-dmg.sh

      - name: Check the disk image works on its own
        run: bash scripts/check-dmg.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Curio-*.dmg \
            --title "Curio ${GITHUB_REF_NAME#v}" --generate-notes
